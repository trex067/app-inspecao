<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Inspeção Técnica - [D]²FR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        /* RESET E TRAVAMENTO DO ECRÃ (Impede que o layout quebre ao rodar o telemóvel) */
        body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background-color: #000; color: white; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
        
        #login-screen { position: fixed; inset: 0; background-color: #111827; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 50; padding: 20px; }
        #app-screen { position: fixed; inset: 0; display: none; }
        
        /* CÂMARA DE FUNDO */
        video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }

        /* GRELHA DA CÂMARA (3x3 TimeMark Style) */
        #grid-overlay { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
        .grid-line { position: absolute; background-color: rgba(255, 255, 255, 0.4); }
        .grid-line.h { width: 100%; height: 1px; left: 0; }
        .grid-line.v { height: 100%; width: 1px; top: 0; }
        
        /* CAMADA DE INTERFACE (UI) */
        #ui-layer { position: absolute; inset: 0; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
        .interactive { pointer-events: auto; }

        /* CANTO SUPERIOR ESQUERDO - MAPA E CONE VERDE */
        #map-container { position: absolute; top: 20px; left: 20px; width: 100px; height: 100px; border-radius: 8px; overflow: hidden; border: 2px solid white; box-shadow: 0 4px 15px rgba(0,0,0,0.6); background: #333; z-index: 20; pointer-events: none; }
        #map-overlay { width: 100%; height: 100%; }
        
        /* CANTO SUPERIOR DIREITO - TEXTOS TIMEMARK */
        #top-right-branding { position: absolute; top: 20px; right: 20px; text-align: right; z-index: 20; text-shadow: 1px 1px 3px rgba(0,0,0,0.9); }

        /* CÓDIGO DE VALIDAÇÃO (LATERAL DIREITA) */
        #validator-sidebar { position: absolute; right: 5px; top: 50%; transform: translateY(-50%) rotate(90deg); transform-origin: center right; color: rgba(255,255,255,0.6); font-family: 'Courier New', Courier, monospace; font-size: 10px; letter-spacing: 1px; white-space: nowrap; z-index: 20; }

        /* ÁREA DE CONTROLOS INFERIOR (Fundo Escuro) */
        #bottom-controls { position: absolute; bottom: 0; left: 0; width: 100%; height: 160px; background: rgba(0,0,0,0.8); z-index: 15; display: flex; flex-direction: column; justify-content: center; align-items: center; pointer-events: auto; }
        
        /* BOTÃO DE DISPARO (SHUTTER) */
        .shutter-btn { width: 70px; height: 70px; border-radius: 50%; border: 3px solid white; background: transparent; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .shutter-btn .inner-circle { width: 54px; height: 54px; border-radius: 50%; background: white; transition: transform 0.1s; }
        .shutter-btn:active .inner-circle { transform: scale(0.9); background: #ddd; }

        /* CARIMBO (TIMEMARK CLONE) - Fica logo acima dos controlos pretos */
        #timemark-stamp { position: absolute; bottom: 160px; left: 0; width: 100%; display: flex; flex-direction: column; pointer-events: none; z-index: 20; }
        
        .tm-module-banner { background-color: #d97706; color: white; font-weight: bold; padding: 6px 15px; width: max-content; font-size: 16px; box-shadow: 2px 2px 5px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 8px;}
        .tm-dark-banner { background-color: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px); color: #e5e7eb; font-size: 11px; padding: 6px 15px; display: flex; justify-content: space-between; align-items: center; }
        .tm-white-footer { background-color: white; color: black; padding: 8px 15px; display: flex; justify-content: space-between; align-items: center; height: 55px; }
        
        .profile-pic-container { width: 36px; height: 36px; border-radius: 50%; border: 2px solid #ccc; overflow: hidden; flex-shrink: 0; }
        .profile-pic-container img { width: 100%; height: 100%; object-fit: cover; }
        
        .logo-container { height: 35px; width: auto; max-width: 100px; display: flex; justify-content: flex-end; }
        .logo-container img { max-height: 100%; object-fit: contain; }

        #canvas { display: none; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="bg-gray-800/90 backdrop-blur-md p-8 rounded-2xl shadow-2xl w-full max-w-sm interactive border border-gray-600">
            <div class="text-center mb-6">
                <div class="w-20 h-20 bg-gradient-to-br from-orange-500 to-orange-700 rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg border-2 border-orange-400">
                    <i class="fas fa-hard-hat text-4xl text-white"></i>
                </div>
                <h1 class="text-2xl font-bold text-white">[D]²FR Engenharia</h1>
                <p class="text-sm text-gray-400 mt-1">Inspeção Técnica</p>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">E-mail Corporativo</label>
                    <input type="email" id="login-email" class="w-full bg-gray-900 text-white border border-gray-600 rounded-lg p-3 focus:border-orange-500 focus:outline-none transition" placeholder="seu@d2fr.com">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Senha</label>
                    <input type="password" id="login-senha" class="w-full bg-gray-900 text-white border border-gray-600 rounded-lg p-3 focus:border-orange-500 focus:outline-none transition" placeholder="••••••••">
                </div>
                <button onclick="fazerLogin()" id="btn-login" class="w-full bg-orange-600 hover:bg-orange-500 text-white font-bold py-3.5 rounded-lg mt-6 shadow-lg shadow-orange-600/30 transition">
                    AUTENTICAR
                </button>
            </div>
        </div>
    </div>

    <div id="app-screen">
        <video id="camera" autoplay playsinline></video>
        
        <div id="grid-overlay">
            <div class="grid-line h" style="top: 33.33%;"></div>
            <div class="grid-line h" style="top: 66.66%;"></div>
            <div class="grid-line v" style="left: 33.33%;"></div>
            <div class="grid-line v" style="left: 66.66%;"></div>
        </div>
        
        <div id="ui-layer">
            
            <div id="map-container">
                <div id="map-overlay"></div>
            </div>

            <div id="top-right-branding">
                <div class="text-[16px] font-black text-orange-400 leading-none">[D]²FR<span class="text-white font-normal text-sm"> Eng</span></div>
                <div class="text-[10px] text-gray-300">Foto 100% Real</div>
            </div>

            <div id="validator-sidebar">
                <i class="fas fa-shield-alt text-gray-400 mr-1"></i> <span id="ui-validator-code">GERANDO...</span>
            </div>

            <div id="timemark-stamp">
                <div class="tm-module-banner">
                    <img src="https://cdn-icons-png.flaticon.com/512/3522/3522619.png" style="width: 24px; filter: brightness(0) invert(1);" alt="icon">
                    <span id="ui-modulo-nome-display">MÓDULO</span>
                </div>
                
                <div class="tm-dark-banner">
                    <div class="flex flex-col gap-1">
                        <div>
                            <span class="font-bold text-gray-300">Time</span> 
                            <span id="ui-time" class="ml-2 font-bold text-white">Buscando hora...</span>
                        </div>
                        <div class="text-[10px] text-gray-300 w-full overflow-hidden whitespace-nowrap text-ellipsis max-w-[80vw]" id="ui-address">
                            Buscando GPS e Endereço...
                        </div>
                    </div>
                </div>
                
                <div class="tm-white-footer">
                    <div class="flex items-center gap-3">
                        <div class="profile-pic-container">
                            <img id="stamp-perfil-img" src="" alt="Perfil">
                        </div>
                        <div class="flex flex-col">
                            <span class="font-bold text-[14px] leading-tight" id="ui-nome-usuario">NOME</span>
                            <span class="text-[11px] text-gray-600 font-semibold" id="ui-cargo-usuario">CARGO</span>
                        </div>
                    </div>
                    <div class="logo-container">
                        <img id="stamp-logo-img" src="" alt="Logo">
                    </div>
                </div>
            </div>

            <div id="bottom-controls">
                <div class="w-full px-6 flex justify-between items-center mb-4 text-white text-xs interactive">
                    
                    <div class="flex flex-col items-center gap-1 cursor-pointer" onclick="syncOfflineQueue()">
                        <div class="relative">
                            <i class="fas fa-cloud-upload-alt text-2xl"></i>
                            <span id="queue-count" class="absolute -top-2 -right-2 bg-red-500 text-white text-[9px] font-bold rounded-full w-4 h-4 flex items-center justify-center hidden">0</span>
                        </div>
                        <span>Uploads</span>
                    </div>

                    <div class="shutter-btn" onclick="takePhoto()">
                        <div class="inner-circle"></div>
                    </div>

                    <div class="flex flex-col items-center gap-1">
                        <select id="modulo-select" onchange="atualizarNomeModulo()" class="bg-transparent text-white font-bold text-center appearance-none outline-none cursor-pointer border-b border-gray-500 pb-1">
                        </select>
                        <span class="text-gray-400">Selecionar Módulo</span>
                    </div>
                </div>
                
                <div class="flex gap-6 text-gray-400 text-xs font-bold uppercase tracking-wider">
                    <span>Vídeo</span>
                    <span class="text-white border-b-2 border-white pb-1">Foto</span>
                    <button onclick="fazerLogout()" class="text-red-400"><i class="fas fa-sign-out-alt"></i> Sair</button>
                </div>
            </div>
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        // =========================================================
        const CONFIG_GAS_URL = "https://script.google.com/macros/s/AKfycbyYcjMX8exgy-b1HwZ2dCvQVxynFwpeAFfYXiBKBgLnlWTDt_HvKf61k0ukp_B5LK2fWA/exec"; 
        // =========================================================

        const video = document.getElementById('camera');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let currentLat = 0;
        let currentLon = 0;
        let map = null; 
        let mapMarker = null; 
        let currentHeading = 0; 
        let currentValidator = ""; 

        // RELÓGIO (Formato TimeMark)
        setInterval(() => {
            const now = new Date();
            const dias = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
            const strData = `${dias[now.getDay()]}, ${String(now.getDate()).padStart(2,'0')}/${String(now.getMonth()+1).padStart(2,'0')}/${now.getFullYear()}`;
            const strHora = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
            document.getElementById('ui-time').innerText = `${strData} ${strHora}`;
        }, 1000);

        function generateValidator() {
            const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            let result = 'TM-';
            for (let i = 0; i < 8; i++) result += chars.charAt(Math.floor(Math.random() * chars.length));
            return result;
        }

        function atualizarNomeModulo() {
            const select = document.getElementById('modulo-select');
            if(select.options.length > 0) {
                document.getElementById('ui-modulo-nome-display').innerText = select.options[select.selectedIndex].text;
            }
        }

        function checkSession() {
            const email = localStorage.getItem('userEmail');
            const nome = localStorage.getItem('userName');
            
            if (email && nome) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('app-screen').style.display = 'block'; 
                
                document.getElementById('ui-nome-usuario').innerText = nome;
                document.getElementById('ui-cargo-usuario').innerText = localStorage.getItem('userRole');
                document.getElementById('stamp-perfil-img').src = localStorage.getItem('userPhoto') || "https://dummyimage.com/100x100/333/fff.jpg&text=F";
                document.getElementById('stamp-logo-img').src = localStorage.getItem('userLogo') || "https://dummyimage.com/200x100/fff/000.png&text=LOGO";

                currentValidator = generateValidator();
                document.getElementById('ui-validator-code').innerText = currentValidator;

                renderizarModulos(); 
                initCamera();
                initGPSAndMap();
                
                // Força o redimensionamento do Leaflet para evitar o bug cinzento
                setTimeout(() => { if(map) map.invalidateSize(); }, 500);
            } else {
                document.getElementById('login-screen').style.display = 'flex';
                document.getElementById('app-screen').style.display = 'none';
            }
        }

        async function fazerLogin() {
            const email = document.getElementById('login-email').value;
            const senha = document.getElementById('login-senha').value;
            if(!email || !senha) return alert("Preencha e-mail e senha.");

            // Pedido de permissão para a bússola (Crucial para iOS)
            requestCompassPermission();

            const btn = document.getElementById('btn-login');
            btn.innerText = "Sincronizando..."; btn.disabled = true;

            try {
                const urlCompleta = `${CONFIG_GAS_URL}?action=login&email=${encodeURIComponent(email)}&senha=${encodeURIComponent(senha)}`;
                const response = await fetch(urlCompleta);
                const data = await response.json();

                if (data.status === "sucesso") {
                    localStorage.setItem('userEmail', email);
                    localStorage.setItem('userSenha', senha);
                    localStorage.setItem('userName', data.nome);
                    localStorage.setItem('userRole', data.cargo);
                    localStorage.setItem('userLogo', data.logo);
                    localStorage.setItem('userPhoto', data.perfil);
                    localStorage.setItem('modulosPlanilha', JSON.stringify(data.modulos));
                    
                    checkSession();
                } else { alert(data.mensagem); }
            } catch (err) { alert("Erro de conexão. Verifique se o URL público foi inserido corretamente no código."); } finally { btn.innerText = "AUTENTICAR"; btn.disabled = false; }
        }

        // ==========================================
        // MAPA SATÉLITE E CONE DE DIREÇÃO
        // ==========================================
        function initGPSAndMap() {
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(
                    (position) => {
                        currentLat = position.coords.latitude;
                        currentLon = position.coords.longitude;
                        
                        updateLiveMap(currentLat, currentLon);
                        
                        // Busca a morada
                        fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${currentLat}&lon=${currentLon}&zoom=18&addressdetails=1`)
                            .then(res => res.json())
                            .then(data => {
                                const end = data.address;
                                const rua = end.road || end.pedestrian || "";
                                const bairro = end.suburb || end.neighbourhood || "";
                                document.getElementById('ui-address').innerText = `${rua}, ${bairro} | Lat: ${currentLat.toFixed(5)}, Lon: ${currentLon.toFixed(5)}`;
                            })
                            .catch(() => document.getElementById('ui-address').innerText = `Lat: ${currentLat.toFixed(5)}, Lon: ${currentLon.toFixed(5)}`);
                    },
                    (error) => console.log("GPS erro:", error), { enableHighAccuracy: true, maximumAge: 0 }
                );
            }
        }

        function updateLiveMap(lat, lon) {
            if (!map) {
                // Mapa bloqueado sem zoom ou arrasto (como no TimeMark)
                map = L.map('map-overlay', { zoomControl: false, attributionControl: false, dragging: false, touchZoom: false, doubleClickZoom: false, scrollWheelZoom: false }).setView([lat, lon], 17);
                L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 }).addTo(map);

                // O PONTO AZUL COM O CONE VERDE (Igual ao Google Maps/TimeMark)
                var iconHtml = `
                    <div style="position: relative; width: 60px; height: 60px; margin-left: -30px; margin-top: -30px;">
                        <svg id="cone-svg" viewBox="0 0 100 100" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; transition: transform 0.1s;">
                            <polygon points="50,50 15,0 85,0" fill="rgba(0, 255, 0, 0.5)" />
                        </svg>
                        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 14px; height: 14px; background-color: #2196F3; border: 2.5px solid white; border-radius: 50%; box-shadow: 0 0 5px rgba(0,0,0,0.8);"></div>
                    </div>
                `;
                var customIcon = L.divIcon({className: 'dummy', html: iconHtml, iconSize: [0, 0]});
                mapMarker = L.marker([lat, lon], {icon: customIcon}).addTo(map);
            } else {
                map.setView([lat, lon]);
                mapMarker.setLatLng([lat, lon]);
            }
        }

        function requestCompassPermission() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => { if (permissionState === 'granted') { window.addEventListener('deviceorientation', handleOrientation); } })
                    .catch(console.error);
            } else {
                window.addEventListener('deviceorientationabsolute', handleOrientation);
                window.addEventListener('deviceorientation', handleOrientation);
            }
        }

        function handleOrientation(event) {
            let heading = null;
            if (event.webkitCompassHeading) { heading = event.webkitCompassHeading; } // iOS
            else if (event.absolute === true && event.alpha !== null) { heading = 360 - event.alpha; } // Android
            else if (event.alpha !== null) { heading = 360 - event.alpha; }

            if (heading !== null) {
                // Roda o cone verde dentro do mapa
                let screenOrientation = (screen.orientation || {}).angle || window.orientation || 0;
                currentHeading = (heading + screenOrientation) % 360;
                
                const cone = document.getElementById('cone-svg');
                if(cone) cone.style.transform = `rotate(${currentHeading}deg)`;
            }
        }

        function takePhoto() {
            alert("A interface visual está pronta! Na ETAPA 2, vamos fundir este layout magnífico diretamente na foto JPG final.");
        }

        function renderizarModulos() { 
            const select = document.getElementById('modulo-select'); 
            select.innerHTML = ''; 
            JSON.parse(localStorage.getItem('modulosPlanilha') || '[]').forEach(mod => { 
                const opt = document.createElement('option'); opt.value = mod.id; opt.innerText = mod.nome; select.appendChild(opt); 
            }); 
            atualizarNomeModulo();
        }
        
        function fazerLogout() { localStorage.clear(); if(video.srcObject) video.srcObject.getTracks().forEach(track => track.stop()); checkSession(); }
        async function initCamera() { try { const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } } }); video.srcObject = stream; } catch (err) { alert("Acesso à câmara negado."); } }
        
        window.onload = checkSession;
    </script>
</body>
</html>
