<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Câmara de Inspeção - [D]²FR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background-color: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; color: white; }
        
        #login-screen { position: fixed; inset: 0; background-color: #111827; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; padding: 20px; }
        
        select { outline: none; appearance: none; }
        .text-shadow-md { text-shadow: 1px 1px 3px rgba(0,0,0,0.8); }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="bg-gray-800/90 backdrop-blur-md p-8 rounded-2xl shadow-2xl w-full max-w-sm border border-gray-600">
            <div class="text-center mb-6">
                <div class="w-20 h-20 bg-gradient-to-br from-orange-500 to-orange-700 rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg border-2 border-orange-400">
                    <i class="fas fa-hard-hat text-4xl text-white"></i>
                </div>
                <h1 class="text-2xl font-bold text-white">[D]²FR Engenharia</h1>
                <p class="text-sm text-gray-400 mt-1">Inspeção Técnica</p>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">E-mail Corporativo</label>
                    <input type="email" id="login-email" class="w-full bg-gray-900 text-white border border-gray-600 rounded-lg p-3 focus:border-orange-500 transition" placeholder="seu@d2fr.com.br">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Senha</label>
                    <input type="password" id="login-senha" class="w-full bg-gray-900 text-white border border-gray-600 rounded-lg p-3 focus:border-orange-500 transition" placeholder="••••••••">
                </div>
                <button onclick="fazerLogin()" id="btn-login" class="w-full bg-orange-600 hover:bg-orange-500 text-white font-bold py-3.5 rounded-lg mt-6 shadow-lg shadow-orange-600/30 transition">
                    AUTENTICAR
                </button>
            </div>
        </div>
    </div>

    <div id="app-screen" class="fixed inset-0 hidden flex-col landscape:flex-row bg-black overflow-hidden">
        
        <div class="flex-1 relative overflow-hidden bg-gray-900">
            <video id="camera" class="absolute inset-0 w-full h-full object-cover" autoplay playsinline></video>
            
            <div class="absolute inset-0 z-10 pointer-events-none">
                <div class="absolute w-full h-[1px] bg-white/40 top-1/3"></div>
                <div class="absolute w-full h-[1px] bg-white/40 top-2/3"></div>
                <div class="absolute h-full w-[1px] bg-white/40 left-1/3"></div>
                <div class="absolute h-full w-[1px] bg-white/40 left-2/3"></div>
            </div>

            <div class="absolute top-4 right-4 z-20 flex flex-col items-end">
                <div id="map-container" class="w-[100px] h-[100px] rounded border-2 border-white/80 shadow-[0_4px_15px_rgba(0,0,0,0.8)] overflow-hidden bg-gray-800 pointer-events-auto">
                    <div id="map-overlay" class="w-full h-full"></div>
                </div>
                <div class="text-[10px] text-white font-bold mt-1 bg-black/50 px-2 py-0.5 rounded backdrop-blur">
                    <i class="fas fa-location-arrow text-orange-400"></i> <span id="ui-compass-text">A calibrar...</span>
                </div>
            </div>

            <div class="absolute top-4 left-4 z-20 text-shadow-md">
                <div class="font-black text-orange-400 text-lg leading-none">TimeMark <span class="font-light text-sm text-white">Clone</span></div>
                <div class="text-[9px] text-gray-200 mt-1">by [D]²FR Engenharia</div>
                <div class="inline-block bg-green-500/30 border border-green-400 text-green-400 text-[9px] font-bold px-1.5 py-0.5 rounded mt-1 backdrop-blur-sm">Foto 100% Real</div>
            </div>

            <div class="absolute top-1/2 right-1 -translate-y-1/2 rotate-90 origin-right text-white/70 font-mono text-[10px] tracking-widest z-20 text-shadow-md whitespace-nowrap landscape:hidden">
                <i class="fas fa-shield-alt"></i> VALIDADOR: <span id="ui-validator-code" class="text-orange-400 font-bold"></span>
            </div>

            <div id="timemark-stamp" class="absolute bottom-0 left-0 w-full z-20 flex flex-col pointer-events-none drop-shadow-xl">
                <div class="flex flex-col items-start w-full">
                    <div class="bg-[#d97706] text-white flex items-center gap-2 px-3 py-1.5 w-max max-w-[80%] rounded-tr-md shadow-lg">
                        <img id="stamp-logo-icon" src="" class="h-4 w-auto object-contain bg-white rounded-sm p-[1px]">
                        <span id="ui-modulo-nome-display" class="font-black text-[13px] uppercase tracking-wider text-shadow-md">MÓDULO</span>
                    </div>
                    <div class="bg-black/65 backdrop-blur-md text-white px-3 py-1 w-max min-w-[65%] max-w-[95%] shadow-lg flex flex-col justify-center">
                        <div class="text-[11px]"><span class="font-bold text-gray-400 mr-2">Time</span><span id="ui-time" class="font-bold tracking-wide">--/--/---- --:--</span></div>
                        <div class="text-[9px] text-gray-400 mt-0.5 truncate w-full" id="ui-address">Buscando coordenadas GPS...</div>
                    </div>
                </div>
                
                <div class="bg-white/95 backdrop-blur-md w-full flex justify-between items-center px-3 py-2 shadow-inner border-t border-gray-300 pointer-events-auto">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full overflow-hidden border border-gray-300 shadow-sm flex-shrink-0 bg-gray-200">
                            <img id="stamp-perfil-img" src="" class="w-full h-full object-cover">
                        </div>
                        <div class="flex flex-col">
                            <span id="ui-nome-usuario" class="font-black text-black text-[14px] leading-none uppercase">NOME</span>
                            <span id="ui-cargo-usuario" class="text-gray-600 text-[10px] font-bold leading-tight mt-0.5 uppercase">CARGO</span>
                        </div>
                    </div>
                    <div class="h-7 flex justify-end flex-shrink-0">
                        <img id="stamp-logo-img" src="" class="h-full w-auto object-contain">
                    </div>
                </div>
            </div>
        </div>

        <div id="controls-area" class="bg-black z-30 flex flex-col justify-between pt-3 pb-2 px-2 landscape:w-[130px] landscape:h-full landscape:flex-row landscape:py-4 landscape:px-2 shadow-[0_-5px_20px_rgba(0,0,0,0.8)] landscape:shadow-[-5px_0_20px_rgba(0,0,0,0.8)] pointer-events-auto">
            
            <div class="flex justify-around items-center w-full landscape:flex-col landscape:h-full landscape:justify-around">
                
                <div class="flex flex-col items-center gap-1 cursor-pointer text-white" onclick="syncOfflineQueue()">
                    <div class="w-11 h-11 rounded-full bg-gray-800 flex items-center justify-center relative border border-gray-600">
                        <i class="far fa-image text-lg"></i>
                        <span id="queue-count" class="absolute -top-1 -right-1 bg-red-500 text-white text-[9px] font-bold rounded-full w-4 h-4 flex items-center justify-center hidden">0</span>
                    </div>
                    <span class="text-[9px] font-bold text-gray-400">Galeria</span>
                </div>

                <div class="w-[75px] h-[75px] rounded-full border-[3.5px] border-white flex items-center justify-center cursor-pointer active:scale-95 transition-transform" onclick="takePhoto()">
                    <div class="w-[61px] h-[61px] bg-white rounded-full"></div>
                </div>

                <div class="flex flex-col items-center gap-1 text-white relative">
                    <div class="w-11 h-11 rounded-full bg-gray-800 flex items-center justify-center border border-gray-600">
                        <i class="fas fa-list-ul text-lg"></i>
                    </div>
                    <select id="modulo-select" onchange="atualizarNomeModulo()" class="absolute inset-0 opacity-0 w-full h-full cursor-pointer text-black bg-transparent"></select>
                    <span class="text-[9px] font-bold text-gray-400">Modelos</span>
                </div>
                
                <div class="flex flex-col items-center gap-1 cursor-pointer text-red-500 landscape:hidden" onclick="fazerLogout()">
                    <div class="w-11 h-11 rounded-full bg-red-900/20 flex items-center justify-center">
                        <i class="fas fa-power-off text-lg"></i>
                    </div>
                    <span class="text-[9px] font-bold">Sair</span>
                </div>
            </div>

            <div class="flex justify-center gap-4 text-[9px] font-black text-gray-500 uppercase pb-1 landscape:flex-col landscape:pb-0 landscape:pl-1 landscape:items-center">
                <span>Vídeo</span>
                <span class="text-white border-b-2 border-orange-500 pb-0.5 landscape:border-b-0 landscape:border-l-2 landscape:pl-1 landscape:text-orange-500">Foto</span>
                <span>Ponto</span>
                <span class="hidden landscape:flex flex-col items-center gap-1 text-red-500 mt-6 cursor-pointer" onclick="fazerLogout()">
                    <div class="w-10 h-10 rounded-full bg-red-900/20 flex items-center justify-center border border-red-900/50"><i class="fas fa-power-off text-lg"></i></div>Sair
                </span>
            </div>
        </div>
    </div>

    <canvas id="canvas" class="hidden"></canvas>

    <script>
        // =========================================================
        const CONFIG_GAS_URL = "https://script.google.com/macros/s/AKfycbyYcjMX8exgy-b1HwZ2dCvQVxynFwpeAFfYXiBKBgLnlWTDt_HvKf61k0ukp_B5LK2fWA/exec"; 
        // =========================================================

        const video = document.getElementById('camera');
        let map = null; 
        let mapMarker = null; 
        let targetHeading = 0; 
        let currentHeading = 0; 

        // Converte o link do Drive para uma miniatura em alta resolução
        function formatDriveUrl(url) {
            if (!url) return "";
            const match = url.match(/id=([a-zA-Z0-9_-]+)/);
            if (match) return `https://drive.google.com/thumbnail?id=${match[1]}&sz=w800`;
            return url;
        }

        // Relógio
        setInterval(() => {
            const now = new Date();
            const dias = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
            const strData = `${dias[now.getDay()]}, ${String(now.getDate()).padStart(2,'0')}/${String(now.getMonth()+1).padStart(2,'0')}/${now.getFullYear()}`;
            const strHora = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
            document.getElementById('ui-time').innerText = `${strData} ${strHora}`;
        }, 1000);

        function generateValidator() {
            const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            let result = '';
            for (let i = 0; i < 10; i++) { if (i===4) result += '-'; else result += chars.charAt(Math.floor(Math.random() * chars.length)); }
            return result;
        }

        function atualizarNomeModulo() {
            const select = document.getElementById('modulo-select');
            if(select.options.length > 0) document.getElementById('ui-modulo-nome-display').innerText = select.options[select.selectedIndex].text;
        }

        function checkSession() {
            const email = localStorage.getItem('userEmail');
            const nome = localStorage.getItem('userName');
            
            if (email && nome) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('app-screen').style.display = 'flex'; 
                
                document.getElementById('ui-nome-usuario').innerText = nome;
                document.getElementById('ui-cargo-usuario').innerText = localStorage.getItem('userRole');
                
                const fotoOriginal = localStorage.getItem('userPhoto');
                const logoOriginal = localStorage.getItem('userLogo');
                document.getElementById('stamp-perfil-img').src = formatDriveUrl(fotoOriginal) || "https://dummyimage.com/100/ccc/fff&text=Foto";
                
                const logoFinal = formatDriveUrl(logoOriginal) || "https://dummyimage.com/200x100/fff/000.png&text=LOGO";
                document.getElementById('stamp-logo-img').src = logoFinal;
                document.getElementById('stamp-logo-icon').src = logoFinal;

                document.getElementById('ui-validator-code').innerText = generateValidator();

                renderizarModulos(); 
                initCamera();
                initGPSAndMap();
                
                setTimeout(() => { if(map) map.invalidateSize(); }, 500);
            } else {
                document.getElementById('login-screen').style.display = 'flex';
                document.getElementById('app-screen').style.display = 'none';
            }
        }

        async function fazerLogin() {
            const email = document.getElementById('login-email').value;
            const senha = document.getElementById('login-senha').value;
            if(!email || !senha) return alert("Preencha e-mail e senha.");

            requestCompassPermission();

            const btn = document.getElementById('btn-login');
            btn.innerText = "A Autenticar..."; btn.disabled = true;

            try {
                const urlCompleta = `${CONFIG_GAS_URL}?action=login&email=${encodeURIComponent(email)}&senha=${encodeURIComponent(senha)}`;
                const response = await fetch(urlCompleta);
                const data = await response.json();

                if (data.status === "sucesso") {
                    localStorage.setItem('userEmail', email);
                    localStorage.setItem('userSenha', senha);
                    localStorage.setItem('userName', data.nome);
                    localStorage.setItem('userRole', data.cargo);
                    localStorage.setItem('userLogo', data.logo);
                    localStorage.setItem('userPhoto', data.perfil);
                    localStorage.setItem('modulosPlanilha', JSON.stringify(data.modulos));
                    
                    checkSession();
                } else { alert(data.mensagem); }
            } catch (err) { alert("Erro de ligação. Verifique a internet."); } finally { btn.innerText = "AUTENTICAR"; btn.disabled = false; }
        }

        // ==========================================
        // MAPA SATÉLITE E BÚSSOLA CORRIGIDA
        // ==========================================
        function initGPSAndMap() {
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        updateLiveMap(lat, lon);
                        
                        fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`)
                            .then(res => res.json())
                            .then(data => {
                                document.getElementById('ui-address').innerText = `${data.display_name || "Rua desconhecida"} | Lat: ${lat.toFixed(5)}, Lon: ${lon.toFixed(5)}`;
                            })
                            .catch(() => document.getElementById('ui-address').innerText = `Lat: ${lat.toFixed(5)}, Lon: ${lon.toFixed(5)}`);
                    },
                    (error) => console.log("GPS erro:", error), { enableHighAccuracy: true }
                );
            }
        }

        function updateLiveMap(lat, lon) {
            if (!map) {
                map = L.map('map-overlay', { zoomControl: false, attributionControl: false, dragging: false, touchZoom: false, doubleClickZoom: false, scrollWheelZoom: false }).setView([lat, lon], 18);
                L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 }).addTo(map);

                var iconHtml = `
                    <div style="position: relative; width: 60px; height: 60px; margin-left: -30px; margin-top: -30px;">
                        <svg id="cone-svg" viewBox="0 0 100 100" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;">
                            <polygon points="50,50 20,0 80,0" fill="rgba(0, 255, 0, 0.4)" stroke="rgba(0,255,0,0.8)" stroke-width="1" />
                        </svg>
                        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 12px; height: 12px; background-color: #2196F3; border: 2px solid white; border-radius: 50%; box-shadow: 0 0 5px rgba(0,0,0,0.8);"></div>
                    </div>
                `;
                var customIcon = L.divIcon({className: 'dummy', html: iconHtml, iconSize: [0, 0]});
                mapMarker = L.marker([lat, lon], {icon: customIcon}).addTo(map);
            } else {
                map.setView([lat, lon]);
                mapMarker.setLatLng([lat, lon]);
            }
        }

        function requestCompassPermission() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(state => { if (state === 'granted') startCompass(); }).catch(console.error);
            } else { startCompass(); }
        }

        function startCompass() {
            if ('ondeviceorientationabsolute' in window) {
                window.addEventListener('deviceorientationabsolute', handleOrientation);
            } else {
                window.addEventListener('deviceorientation', handleOrientation);
            }
        }

        function getDirectionText(heading) {
            const dirs = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
            return dirs[Math.round(((heading %= 360) < 0 ? heading + 360 : heading) / 45) % 8];
        }

        function handleOrientation(event) {
            let heading = null;
            if (event.webkitCompassHeading) { heading = event.webkitCompassHeading; }
            else if (event.absolute === true && event.alpha !== null) { heading = 360 - event.alpha; }
            else if (event.alpha !== null) { heading = 360 - event.alpha; }

            if (heading !== null) {
                let screenOrientation = (screen.orientation || {}).angle || window.orientation || 0;
                targetHeading = (heading + screenOrientation) % 360; 
                
                const compassText = document.getElementById('ui-compass-text');
                if(compassText) compassText.innerText = `${getDirectionText(targetHeading)} ${Math.round(targetHeading)}°`;
            }
        }

        function animateCompass() {
            let diff = targetHeading - currentHeading;
            if (diff > 180) diff -= 360;
            if (diff < -180) diff += 360;
            currentHeading += diff * 0.15; 
            
            const cone = document.getElementById('cone-svg');
            if (cone) cone.style.transform = `rotate(${currentHeading}deg)`;
            
            requestAnimationFrame(animateCompass);
        }
        animateCompass();

        // Ouve a rotação do ecrã para corrigir o mapa
        window.addEventListener("orientationchange", function() {
            setTimeout(() => { if(map) map.invalidateSize(); }, 300);
        });

        function takePhoto() {
            alert("Agora sim! Layout fixo perfeito e bússola exata. Pode dar a aprovação para a ETAPA 2 (Imprimir a foto final).");
        }

        function renderizarModulos() { 
            const select = document.getElementById('modulo-select'); 
            select.innerHTML = ''; 
            JSON.parse(localStorage.getItem('modulosPlanilha') || '[]').forEach(mod => { 
                const opt = document.createElement('option'); opt.value = mod.id; opt.innerText = mod.nome; select.appendChild(opt); 
            }); 
            atualizarNomeModulo();
        }
        
        function fazerLogout() { localStorage.clear(); if(video.srcObject) video.srcObject.getTracks().forEach(track => track.stop()); checkSession(); }
        async function initCamera() { try { const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } } }); video.srcObject = stream; } catch (err) { alert("Acesso à câmara negado."); } }
        
        window.onload = checkSession;
    </script>
</body>
</html>
