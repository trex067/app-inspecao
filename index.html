<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Câmera de Inspeção - [D]²FR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; color: white; font-family: sans-serif; }
        #login-screen { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #111827; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 20; padding: 20px; box-sizing: border-box; }
        #app-screen { position: relative; width: 100vw; height: 100vh; display: none; justify-content: center; align-items: center; }
        video { width: 100%; height: 100%; object-fit: cover; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; padding: 20px; box-sizing: border-box; }
        .interactive { pointer-events: auto; }
        .glass-panel { background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(10px); border-radius: 12px; padding: 15px; }
        #canvas { display: none; }
    </style>
</head>
<body>
    <div id="login-screen">
        <div class="bg-gray-800 p-8 rounded-xl shadow-2xl w-full max-w-sm">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-orange-500 rounded-full flex items-center justify-center mx-auto mb-3 shadow-lg">
                    <i class="fas fa-hard-hat text-3xl text-white"></i>
                </div>
                <h1 class="text-xl font-bold text-white">[D]²FR Engenharia</h1>
                <p class="text-sm text-gray-400">Sistema de Inspeção</p>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm text-gray-400 mb-1">E-mail</label>
                    <input type="email" id="login-email" class="w-full bg-gray-700 text-white border border-gray-600 rounded-lg p-3" placeholder="seu@email.com">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Senha</label>
                    <input type="password" id="login-senha" class="w-full bg-gray-700 text-white border border-gray-600 rounded-lg p-3" placeholder="••••••••">
                </div>
                <button onclick="fazerLogin()" id="btn-login" class="w-full bg-orange-600 hover:bg-orange-500 text-white font-bold py-3 rounded-lg mt-4 transition">
                    Entrar e Sincronizar
                </button>
            </div>
        </div>
    </div>

    <div id="app-screen">
        <video id="camera" autoplay playsinline></video>
        <div id="ui-layer">
            <div class="flex justify-between items-start interactive">
                <div class="glass-panel text-sm flex flex-col gap-1">
                    <span id="gps-status" class="text-yellow-400"><i class="fas fa-satellite-dish"></i> Buscando GPS...</span>
                    <span id="coords" class="text-xs text-gray-300">Lat: --, Lon: --</span>
                </div>
                <div class="flex gap-2 flex-col items-end">
                    <button onclick="fazerLogout()" class="bg-red-600 text-white p-3 rounded-full shadow-lg text-xs font-bold mb-2"><i class="fas fa-sign-out-alt"></i> Sair</button>
                    <div class="flex gap-2">
                        <button onclick="syncOfflineQueue()" class="bg-blue-600 p-3 rounded-full shadow-lg relative">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <span id="queue-count" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center hidden">0</span>
                        </button>
                    </div>
                </div>
            </div>

            <div class="flex flex-col gap-4 interactive">
                <div class="glass-panel py-2 px-4 mb-2 flex justify-between items-center text-sm">
                    <span class="font-bold text-orange-400" id="ui-nome-usuario">Usuário</span>
                    <span class="text-gray-300 text-xs" id="ui-cargo-usuario">Cargo</span>
                </div>
                
                <select id="modulo-select" class="w-full bg-gray-800 text-white border border-gray-600 p-3 rounded-lg shadow-lg text-lg"></select>

                <div class="flex justify-center">
                    <button onclick="takePhoto()" class="w-20 h-20 bg-white rounded-full border-4 border-gray-400 flex items-center justify-center active:bg-gray-300 transition shadow-[0_0_15px_rgba(0,0,0,0.5)]">
                        <div class="w-16 h-16 bg-white rounded-full border border-gray-300"></div>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        // =========================================================
        console.log("[SISTEMA] Iniciando verificação de variáveis globais...");
        const CONFIG_GAS_URL = "INJETAR_URL_AQUI";
        console.log("[SISTEMA] Valor atual da URL do Google:", CONFIG_GAS_URL);
        // =========================================================

        const video = document.getElementById('camera');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let currentLat = 0;
        let currentLon = 0;

        function checkSession() {
            console.log("[SISTEMA] Verificando se o usuário já tem sessão salva...");
            const email = localStorage.getItem('userEmail');
            const nome = localStorage.getItem('userName');
            
            if (email && nome) {
                console.log("[SISTEMA] Sessão encontrada para:", nome);
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('app-screen').style.display = 'flex';
                document.getElementById('ui-nome-usuario').innerText = nome;
                document.getElementById('ui-cargo-usuario').innerText = localStorage.getItem('userRole');
                
                renderizarModulos(); 
                initCamera();
                initGPS();
            } else {
                console.log("[SISTEMA] Nenhuma sessão ativa. Exibindo tela de login.");
                document.getElementById('login-screen').style.display = 'flex';
                document.getElementById('app-screen').style.display = 'none';
            }
        }

        async function fazerLogin() {
            console.log("[LOGIN] Botão de entrar clicado!");
            const email = document.getElementById('login-email').value;
            const senha = document.getElementById('login-senha').value;
            console.log("[LOGIN] Email digitado:", email);

            if(!email || !senha) {
                console.log("[LOGIN] Erro: Campos vazios.");
                return alert("Preencha e-mail e senha.");
            }
            
            if(CONFIG_GAS_URL === "INJETAR_URL_AQUI") {
                console.error("[CRÍTICO] O robô do GitHub não substituiu a URL! A variável continua como 'INJETAR_URL_AQUI'. O sistema vai abortar a conexão para não travar.");
                return alert("ERRO DO SISTEMA: O servidor não configurou a URL secreta corretamente. Contate o administrador.");
            }

            console.log("[LOGIN] A URL parece estar configurada corretamente. Iniciando conexão com o Google Sheets...");
            const btn = document.getElementById('btn-login');
            btn.innerText = "Sincronizando Dados...";
            btn.disabled = true;

            try {
                const urlCompleta = `${CONFIG_GAS_URL}?action=login&email=${encodeURIComponent(email)}&senha=${encodeURIComponent(senha)}`;
                console.log("[LOGIN] Rota chamada (senha oculta):", `${CONFIG_GAS_URL}?action=login&email=${encodeURIComponent(email)}`);
                
                const response = await fetch(urlCompleta);
                console.log("[LOGIN] Resposta bruta recebida do Google:", response);
                
                const data = await response.json();
                console.log("[LOGIN] Dados decodificados do Google:", data);

                if (data.status === "sucesso") {
                    console.log("[LOGIN] Sucesso! Salvando dados no celular...");
                    localStorage.setItem('userEmail', email);
                    localStorage.setItem('userSenha', senha);
                    localStorage.setItem('userName', data.nome);
                    localStorage.setItem('userRole', data.cargo);
                    localStorage.setItem('modulosPlanilha', JSON.stringify(data.modulos));
                    
                    checkSession();
                } else {
                    console.log("[LOGIN] O Google recusou o acesso. Motivo:", data.mensagem);
                    alert(data.mensagem);
                }
            } catch (err) {
                console.error("[LOGIN] Ocorreu um erro catastrófico na conexão de internet ou no link:", err);
                alert("Erro ao conectar com o servidor. Verifique a sua internet.");
            } finally {
                btn.innerText = "Entrar e Sincronizar";
                btn.disabled = false;
            }
        }

        function renderizarModulos() {
            console.log("[SISTEMA] Renderizando módulos no select...");
            const select = document.getElementById('modulo-select');
            select.innerHTML = ''; 
            
            const modulosStr = localStorage.getItem('modulosPlanilha');
            if (modulosStr) {
                const modulos = JSON.parse(modulosStr);
                console.log("[SISTEMA] Módulos encontrados:", modulos);
                modulos.forEach(mod => {
                    const opt = document.createElement('option');
                    opt.value = mod.id; 
                    opt.innerText = mod.nome; 
                    select.appendChild(opt);
                });
            }
        }

        function fazerLogout() {
            console.log("[SISTEMA] Fazendo logout e limpando memória...");
            localStorage.clear(); 
            if(video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }
            checkSession();
        }

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } } });
                video.srcObject = stream;
            } catch (err) {
                console.error("[CAMERA] Erro de permissão:", err);
            }
        }

        function initGPS() {
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(
                    (position) => {
                        currentLat = position.coords.latitude;
                        currentLon = position.coords.longitude;
                        document.getElementById('gps-status').innerHTML = '<i class="fas fa-map-marker-alt"></i> GPS Ativo';
                        document.getElementById('gps-status').className = 'text-green-400';
                        document.getElementById('coords').innerText = `Lat: ${currentLat.toFixed(5)}, Lon: ${currentLon.toFixed(5)}`;
                    },
                    (error) => {
                        console.error("[GPS] Erro:", error);
                    }, { enableHighAccuracy: true }
                );
            }
        }

        window.onload = () => {
            console.log("[SISTEMA] Aplicativo carregado. Iniciando rotinas...");
            checkSession();
        };
    </script>
</body>
</html>
